name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff openpyxl

      - name: Lint with ruff
        run: |
          ruff check . --select=E,F,W --ignore=E501,E402,F401 --exit-zero

      - name: Run tests
        run: |
          cd ai_yemekhane
          python -m pytest tests/ -v --tb=short -q
        env:
          GEMINI_API_KEY: "test-key"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check . --select=E,F,W --ignore=E501,E402,F401 --statistics
