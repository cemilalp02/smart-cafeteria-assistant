<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI Smart Cafeteria Waste Reduction - System Architecture</title>
  <desc id="desc">Architecture diagram showing web and mobile clients, FastAPI backend routes, AI service modules, database, model artifacts, CSV data, external Gemini and Expo Push APIs, and the closed-loop waste-reduction flow.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #5c6773; }
      .layer-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #17212b; }
      .card-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #17212b; }
      .card-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #40505f; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #5c6773; }
      .pill { font: 700 12px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .note { font: 600 14px Arial, Helvetica, sans-serif; fill: #344250; }
      .container { fill: #ffffff; stroke: #d8e0e8; stroke-width: 1.4; rx: 8; }
      .shadow { filter: drop-shadow(0 8px 18px rgba(28, 40, 52, .10)); }
      .client { fill: #eff8f2; stroke: #83b88b; }
      .api { fill: #eef6ff; stroke: #7daee2; }
      .service { fill: #f6f1fb; stroke: #b79bd6; }
      .data { fill: #fff7e7; stroke: #d9ad58; }
      .external { fill: #fff1ef; stroke: #d88d83; }
      .flow { fill: #f1f7f9; stroke: #95b8c4; }
      .header-client { fill: #2f7d47; }
      .header-api { fill: #2d6fae; }
      .header-service { fill: #7a55a2; }
      .header-data { fill: #a77115; }
      .header-external { fill: #b4574f; }
      .header-flow { fill: #327481; }
      .arrow { stroke: #415161; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #728191; stroke-width: 1.8; fill: none; marker-end: url(#arrowSoft); }
      .arrow-dashed { stroke: #8b6c63; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowDash); }
      .db-cylinder { fill: #fff8e8; stroke: #b98d32; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#415161"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 z" fill="#728191"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 z" fill="#8b6c63"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120"/>

  <text class="title" x="64" y="68">AI Smart Cafeteria Waste Reduction - System Architecture</text>
  <text class="subtitle" x="64" y="98">FastAPI backend, Jinja web UI, Expo React Native mobile app, AI/ML modules, SQLAlchemy persistence and model artifacts</text>

  <!-- Layer containers -->
  <g class="shadow">
    <rect class="container" x="50" y="132" width="280" height="690"/>
    <rect class="container" x="370" y="132" width="390" height="690"/>
    <rect class="container" x="800" y="132" width="430" height="690"/>
    <rect class="container" x="1270" y="132" width="480" height="690"/>
  </g>

  <rect class="header-client" x="50" y="132" width="280" height="42" rx="8"/>
  <rect class="header-api" x="370" y="132" width="390" height="42" rx="8"/>
  <rect class="header-service" x="800" y="132" width="430" height="42" rx="8"/>
  <rect class="header-data" x="1270" y="132" width="480" height="42" rx="8"/>
  <text class="pill" x="72" y="158">CLIENT / INPUT LAYER</text>
  <text class="pill" x="392" y="158">FASTAPI APPLICATION LAYER</text>
  <text class="pill" x="822" y="158">AI + BUSINESS SERVICE LAYER</text>
  <text class="pill" x="1292" y="158">DATA + MODEL LAYER</text>

  <!-- Client cards -->
  <g>
    <rect class="client" x="72" y="202" width="236" height="92" rx="8"/>
    <text class="card-title" x="92" y="230">Student Web UI</text>
    <text class="card-text" x="92" y="254">Jinja templates</text>
    <text class="card-text" x="92" y="274">/, /today-menu, /rate, /chat, /vote</text>

    <rect class="client" x="72" y="316" width="236" height="92" rx="8"/>
    <text class="card-title" x="92" y="344">Admin Web Panel</text>
    <text class="card-text" x="92" y="368">Dashboard and operations pages</text>
    <text class="card-text" x="92" y="388">/admin, /report, /production</text>

    <rect class="client" x="72" y="430" width="236" height="104" rx="8"/>
    <text class="card-title" x="92" y="458">Mobile App</text>
    <text class="card-text" x="92" y="482">Expo React Native</text>
    <text class="card-text" x="92" y="502">Home, Menu, Rate, Vote, Chat</text>
    <text class="card-text" x="92" y="522">fetches /api/v1/*</text>

    <rect class="client" x="72" y="556" width="236" height="92" rx="8"/>
    <text class="card-title" x="92" y="584">IoT Weight Input</text>
    <text class="card-text" x="92" y="608">/api/v1/iot/weight-data</text>
    <text class="card-text" x="92" y="628">real or simulated scale data</text>

    <rect class="client" x="72" y="670" width="236" height="104" rx="8"/>
    <text class="card-title" x="92" y="698">Data + Training Scripts</text>
    <text class="card-text" x="92" y="722">seed/load menu CSV</text>
    <text class="card-text" x="92" y="742">train menu, waste and sentiment</text>
    <text class="card-text" x="92" y="762">backup, data cleanup</text>
  </g>

  <!-- API cards -->
  <g>
    <rect class="api" x="394" y="202" width="342" height="126" rx="8"/>
    <text class="card-title" x="416" y="230">FastAPI App - main.py</text>
    <text class="card-text" x="416" y="254">Router registration, app startup</text>
    <text class="card-text" x="416" y="274">CORS middleware for mobile origins</text>
    <text class="card-text" x="416" y="294">/api/* -> /api/v1/* redirect middleware</text>
    <text class="card-text" x="416" y="314">Static assets and Jinja template serving</text>

    <rect class="api" x="394" y="356" width="342" height="86" rx="8"/>
    <text class="card-title" x="416" y="384">Pages + Static Routes</text>
    <text class="card-text" x="416" y="408">Student pages, admin pages, login cookie</text>
    <text class="card-text" x="416" y="428">templates/ and static/ assets</text>

    <rect class="api" x="394" y="464" width="342" height="86" rx="8"/>
    <text class="card-title" x="416" y="492">Student API Routes</text>
    <text class="card-text" x="416" y="516">menu, ratings, voting, chatbot</text>
    <text class="card-text" x="416" y="536">today menu, rate meal, AI chat, A/B voting</text>

    <rect class="api" x="394" y="572" width="342" height="98" rx="8"/>
    <text class="card-title" x="416" y="600">Admin + Analytics API Routes</text>
    <text class="card-text" x="416" y="624">production, waste, analytics, maliyet</text>
    <text class="card-text" x="416" y="644">reports, simulation, tasks</text>
    <text class="card-text" x="416" y="664">PDF/Excel exports and background jobs</text>

    <rect class="api" x="394" y="692" width="342" height="86" rx="8"/>
    <text class="card-title" x="416" y="720">AI Ops + Realtime Routes</text>
    <text class="card-text" x="416" y="744">anomaly, XAI, model tracker, auto trainer</text>
    <text class="card-text" x="416" y="764">notifications and /ws/dashboard</text>
  </g>

  <!-- Service cards -->
  <g>
    <rect class="service" x="824" y="202" width="382" height="82" rx="8"/>
    <text class="card-title" x="846" y="230">Chatbot Service</text>
    <text class="card-text" x="846" y="254">Gemini model with function-calling tools</text>
    <text class="card-text" x="846" y="274">menu, ratings, waste, cost and feedback lookups</text>

    <rect class="service" x="824" y="304" width="382" height="94" rx="8"/>
    <text class="card-title" x="846" y="332">Menu Optimizer</text>
    <text class="card-text" x="846" y="356">GradientBoosting / RandomForest popularity model</text>
    <text class="card-text" x="846" y="376">multi-objective scoring: popularity, waste, nutrition, cost</text>

    <rect class="service" x="824" y="418" width="382" height="94" rx="8"/>
    <text class="card-title" x="846" y="446">Waste Analyzer</text>
    <text class="card-text" x="846" y="470">RF + GBR + XGBoost ensemble when trained</text>
    <text class="card-text" x="846" y="490">fallback: ratings and production rules</text>

    <rect class="service" x="824" y="532" width="382" height="82" rx="8"/>
    <text class="card-title" x="846" y="560">Feedback + Sentiment</text>
    <text class="card-text" x="846" y="584">student comments, self-report waste, themes</text>
    <text class="card-text" x="846" y="604">Turkish sentiment TF-IDF model artifacts</text>

    <rect class="service" x="824" y="634" width="382" height="82" rx="8"/>
    <text class="card-title" x="846" y="662">Planning, Anomaly + XAI</text>
    <text class="card-text" x="846" y="686">production planner, trend analysis, A/B engine</text>
    <text class="card-text" x="846" y="706">Z-score, Isolation Forest, SHAP explanations</text>

    <rect class="service" x="824" y="736" width="382" height="56" rx="8"/>
    <text class="card-title" x="846" y="764">Reports + Notifications</text>
    <text class="card-text" x="846" y="784">PDF/Excel reports, WebSocket dashboard, Expo push</text>
  </g>

  <!-- Data cards -->
  <g>
    <rect class="data" x="1298" y="202" width="424" height="90" rx="8"/>
    <text class="card-title" x="1320" y="230">SQLAlchemy ORM</text>
    <text class="card-text" x="1320" y="254">models.py, get_db dependency, Alembic migrations</text>
    <text class="card-text" x="1320" y="274">SQLite by default; PostgreSQL via DATABASE_URL</text>

    <g>
      <path class="db-cylinder" d="M1320 326 C1320 304, 1700 304, 1700 326 L1700 438 C1700 460, 1320 460, 1320 438 Z"/>
      <ellipse class="db-cylinder" cx="1510" cy="326" rx="190" ry="22"/>
      <text class="card-title" x="1350" y="340">yemekhane.db</text>
      <text class="card-text" x="1350" y="366">yemekler, menuler, kullanicilar</text>
      <text class="card-text" x="1350" y="386">menu_puanlama, uretim_log, alerts</text>
      <text class="card-text" x="1350" y="406">menu_oneri_log, menu_alternatif, menu_oylama</text>
      <text class="card-text" x="1350" y="426">anomali_kayitlari, push_tokens</text>
    </g>

    <rect class="data" x="1298" y="488" width="424" height="114" rx="8"/>
    <text class="card-title" x="1320" y="516">Model Artifacts - models_data/</text>
    <text class="card-text" x="1320" y="540">menu_popularity_model.joblib</text>
    <text class="card-text" x="1320" y="560">waste_predictor.joblib and metrics</text>
    <text class="card-text" x="1320" y="580">sentiment_tfidf model + vectorizer</text>

    <rect class="data" x="1298" y="628" width="424" height="86" rx="8"/>
    <text class="card-title" x="1320" y="656">Reference Data - data/</text>
    <text class="card-text" x="1320" y="680">menu_data.csv for menus and training</text>
    <text class="card-text" x="1320" y="700">nutrition_data.csv for calories and macros</text>

    <rect class="data" x="1298" y="740" width="424" height="52" rx="8"/>
    <text class="card-title" x="1320" y="768">Configuration</text>
    <text class="card-text" x="1320" y="788">.env: GEMINI_API_KEY, ADMIN_PASSWORD, CORS_ORIGINS</text>
  </g>

  <!-- External services -->
  <g class="shadow">
    <rect class="container" x="1270" y="852" width="480" height="126"/>
  </g>
  <rect class="header-external" x="1270" y="852" width="480" height="42" rx="8"/>
  <text class="pill" x="1292" y="878">EXTERNAL INTEGRATIONS</text>
  <rect class="external" x="1298" y="914" width="200" height="42" rx="8"/>
  <text class="card-title" x="1320" y="941">Google Gemini API</text>
  <rect class="external" x="1518" y="914" width="204" height="42" rx="8"/>
  <text class="card-title" x="1540" y="941">Expo Push API</text>

  <!-- Main arrows -->
  <path class="arrow" d="M308 248 C342 248, 356 248, 394 248"/>
  <path class="arrow" d="M308 362 C342 362, 356 388, 394 396"/>
  <path class="arrow" d="M308 482 C342 482, 356 494, 394 506"/>
  <path class="arrow" d="M308 602 C342 602, 356 612, 394 622"/>
  <path class="arrow" d="M736 264 C770 264, 790 242, 824 242"/>
  <path class="arrow" d="M736 506 C772 506, 790 350, 824 350"/>
  <path class="arrow" d="M736 622 C772 622, 790 464, 824 464"/>
  <path class="arrow" d="M736 744 C772 744, 790 674, 824 674"/>

  <path class="arrow-soft" d="M1206 244 C1240 244, 1260 244, 1298 244"/>
  <path class="arrow-soft" d="M1206 350 C1240 350, 1260 352, 1320 354"/>
  <path class="arrow-soft" d="M1206 464 C1240 464, 1260 522, 1298 538"/>
  <path class="arrow-soft" d="M1206 572 C1240 572, 1260 670, 1298 674"/>
  <path class="arrow-soft" d="M1206 674 C1240 674, 1260 408, 1320 408"/>
  <path class="arrow-soft" d="M308 724 C520 830, 1070 830, 1310 694"/>

  <path class="arrow-dashed" d="M1206 242 C1264 274, 1286 912, 1350 914"/>
  <path class="arrow-dashed" d="M1206 764 C1300 808, 1450 878, 1580 914"/>
  <path class="arrow-dashed" d="M308 724 C576 890, 950 918, 1298 936"/>

  <!-- Closed-loop flow -->
  <g class="shadow">
    <rect class="container" x="50" y="852" width="1180" height="196"/>
  </g>
  <rect class="header-flow" x="50" y="852" width="1180" height="42" rx="8"/>
  <text class="pill" x="72" y="878">CLOSED-LOOP WASTE REDUCTION FLOW</text>

  <g>
    <rect class="flow" x="82" y="922" width="180" height="78" rx="8"/>
    <text class="card-title" x="106" y="950">1. Inputs</text>
    <text class="card-text" x="106" y="974">ratings, comments, votes</text>
    <text class="card-text" x="106" y="994">production and scale logs</text>

    <rect class="flow" x="302" y="922" width="180" height="78" rx="8"/>
    <text class="card-title" x="326" y="950">2. Persist</text>
    <text class="card-text" x="326" y="974">SQLAlchemy writes</text>
    <text class="card-text" x="326" y="994">DB tables and alerts</text>

    <rect class="flow" x="522" y="922" width="180" height="78" rx="8"/>
    <text class="card-title" x="546" y="950">3. Learn</text>
    <text class="card-text" x="546" y="974">training tasks update</text>
    <text class="card-text" x="546" y="994">joblib model artifacts</text>

    <rect class="flow" x="742" y="922" width="180" height="78" rx="8"/>
    <text class="card-title" x="766" y="950">4. Optimize</text>
    <text class="card-text" x="766" y="974">menu suggestions</text>
    <text class="card-text" x="766" y="994">waste and cost predictions</text>

    <rect class="flow" x="962" y="922" width="222" height="78" rx="8"/>
    <text class="card-title" x="986" y="950">5. Act</text>
    <text class="card-text" x="986" y="974">admin dashboard, reports</text>
    <text class="card-text" x="986" y="994">mobile/web updates and push alerts</text>
  </g>
  <path class="arrow" d="M262 961 L302 961"/>
  <path class="arrow" d="M482 961 L522 961"/>
  <path class="arrow" d="M702 961 L742 961"/>
  <path class="arrow" d="M922 961 L962 961"/>
  <path class="arrow-soft" d="M1184 961 C1218 961, 1218 1034, 82 1034 C58 1034, 58 961, 82 961"/>

  <!-- Legend and notes -->
  <g>
    <rect x="64" y="104" width="20" height="4" fill="#415161"/>
    <text class="small" x="92" y="111">solid arrows: request/response or internal module call</text>
    <line x1="396" y1="106" x2="416" y2="106" stroke="#8b6c63" stroke-width="3" stroke-dasharray="6 5"/>
    <text class="small" x="426" y="111">dashed arrows: external/offline integrations</text>
  </g>

  <text class="note" x="64" y="1086">Generated from project structure: ai_yemekhane/main.py, api/routes/*, modules/*, models.py, mobile_app/src/*, data/, models_data/.</text>
</svg>
