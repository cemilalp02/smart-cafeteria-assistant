  <g class="shadow-soft">
    <rect class="api-card" x="424" y="260" width="260" height="472"/>
    <rect class="blue" x="454" y="298" width="200" height="88" rx="8"/>
  </g>
  <text class="label-white" x="505" y="334">FastAPI</text>
  <text class="tiny" x="492" y="360">/api/v1</text>

  <g>
    <rect x="456" y="426" width="82" height="72" rx="8" fill="#fff" stroke="#5c94d1" stroke-width="2"/>
    <path class="icon" d="M478 458 L492 444 L506 458 L520 444"/>
    <text class="tiny" x="476" y="486">MENU</text>

