    <path class="icon" d="M10 76 C16 52, 60 52, 66 76"/>
    <circle cx="62" cy="54" r="12" fill="#2f7d47"/>
    <path d="M56 54 L61 59 L69 48" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="label" x="206" y="720">ADMIN</text>
  <text class="tiny" x="206" y="744">dashboard</text>
  <text class="tiny" x="206" y="764">operations</text>

