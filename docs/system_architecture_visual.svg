  <path class="icon" d="M1208 284 C1196 260, 1222 250, 1210 232"/>
  <text class="caption" x="862" y="692">ANOMALY</text>
  <path class="icon" d="M950 709 L964 681 L978 709"/>
  <text class="caption" x="1138" y="692">XAI</text>
  <circle cx="1198" cy="696" r="18" fill="none" stroke="#26323d" stroke-width="4"/>
  <circle cx="1198" cy="696" r="6" fill="#7652a6"/>
  <text class="caption" x="954" y="812">FEEDBACK + SENTIMENT + PLANNING</text>

  <!-- Clean radial connectors, no arrowheads -->
  <path class="connect" d="M960 304 L998 412"/>
  <path class="connect" d="M1138 304 L1084 414"/>
  <path class="connect" d="M962 660 L1000 580"/>
  <path class="connect" d="M1136 660 L1082 580"/>
  <path class="connect" d="M1032 774 L1038 624"/>

  <!-- Data / models -->
