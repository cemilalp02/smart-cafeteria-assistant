    <path class="db" d="M1400 246 C1400 224, 1704 224, 1704 246 L1704 376 C1704 398, 1400 398, 1400 376 Z"/>
    <ellipse class="db" cx="1552" cy="246" rx="152" ry="22"/>
  </g>
  <text class="label" x="1516" y="294">DB</text>
  <text class="tiny" x="1460" y="326">ratings + production + votes</text>
  <text class="tiny" x="1478" y="348">menus + alerts + tokens</text>

