    <path class="icon" d="M609 468 L624 482"/>
    <text class="tiny" x="592" y="486">CHAT</text>

    <rect x="456" y="532" width="82" height="72" rx="8" fill="#fff" stroke="#5c94d1" stroke-width="2"/>
    <rect x="480" y="548" width="34" height="26" rx="4" fill="#2f6fae" opacity=".20"/>
    <line class="icon" x1="475" y1="574" x2="520" y2="574"/>
    <text class="tiny" x="474" y="592">WASTE</text>

    <rect x="570" y="532" width="82" height="72" rx="8" fill="#fff" stroke="#5c94d1" stroke-width="2"/>
    <path class="icon" d="M592 578 L592 552 L628 552 L628 578"/>
    <line class="icon" x1="584" y1="578" x2="636" y2="578"/>
