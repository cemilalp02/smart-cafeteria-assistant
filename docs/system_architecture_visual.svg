<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">AI Smart Cafeteria Waste Reduction - Visual System Architecture</title>
  <desc id="desc">A visual-first architecture diagram with clean non-overlapping arrows between inputs, FastAPI, AI services, data stores, model artifacts and feedback loop.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 900 38px Arial, Helvetica, sans-serif; fill: #12202e; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #526170; }
      .layer { fill: #ffffff; stroke: #d8e1ea; stroke-width: 1.4; rx: 8; }
      .shadow { filter: drop-shadow(0 14px 26px rgba(25, 35, 45, .13)); }
      .shadow-soft { filter: drop-shadow(0 7px 14px rgba(25, 35, 45, .10)); }
      .header { font: 900 15px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .label { font: 900 19px Arial, Helvetica, sans-serif; fill: #12202e; }
      .label-white { font: 900 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .caption { font: 800 13px Arial, Helvetica, sans-serif; fill: #344250; letter-spacing: .2px; }
      .tiny { font: 700 11px Arial, Helvetica, sans-serif; fill: #617282; letter-spacing: .3px; }
      .num { font: 900 24px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .green { fill: #2f7d47; }
      .blue { fill: #2f6fae; }
      .purple { fill: #7652a6; }
      .gold { fill: #a77115; }
      .red { fill: #b6534a; }
      .teal { fill: #2d7781; }
      .input-card { fill: #eaf7ef; stroke: #64a876; stroke-width: 1.4; rx: 8; }
      .api-card { fill: #e8f2ff; stroke: #5c94d1; stroke-width: 1.4; rx: 8; }
      .ai-card { fill: #f4eefb; stroke: #a181cb; stroke-width: 1.4; rx: 8; }
      .data-card { fill: #fff5dc; stroke: #c79332; stroke-width: 1.5; rx: 8; }
      .external-card { fill: #fff0ed; stroke: #c66b5f; stroke-width: 1.4; rx: 8; }
      .icon { stroke: #26323d; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #26323d; }
      .flow { stroke: #344250; stroke-width: 3.2; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .flow-soft { stroke: #66788a; stroke-width: 2.4; fill: none; marker-end: url(#arrowSoft); stroke-linecap: round; stroke-linejoin: round; }
      .flow-dashed { stroke: #8f6d63; stroke-width: 2.2; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrowDash); stroke-linecap: round; stroke-linejoin: round; }
      .connect { stroke: #8e6cbc; stroke-width: 3; fill: none; stroke-linecap: round; opacity: .85; }
      .loop { stroke: #2d7781; stroke-width: 4.2; fill: none; marker-end: url(#arrowLoop); stroke-linecap: round; stroke-linejoin: round; }
      .db { fill: #fff8e8; stroke: #a77115; stroke-width: 2; }
      .file { fill: #fffdf7; stroke: #a77115; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#344250"/>
    </marker>
    <marker id="arrowSoft" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#66788a"/>
    </marker>
    <marker id="arrowDash" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#8f6d63"/>
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d7781"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1100"/>
  <text class="title" x="64" y="68">System Architecture</text>
  <text class="subtitle" x="64" y="96">AI Smart Cafeteria Waste Reduction - cleaner visual map of requests, intelligence, storage and actions</text>

